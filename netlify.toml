# Netlify: the course website in site/ is plain static files, so there's nothing to build. The
# lesson pages read each project's README.md from the repo, so the whole repo is published.
[build]
  publish = "."
  command = "echo 'The course site is static: nothing to build'"

[[redirects]]
  from = "/"
  to = "/site/"
  status = 302

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
