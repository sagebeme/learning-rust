name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, lint and test every solution
    runs-on: ubuntu-latest

    # 0x0B's tests run against a real Postgres, like the one the README asks you to start.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show

      - name: Starter code is formatted
        run: cargo fmt --all --check

      - name: Every task has tests that fail on its starter
        run: cargo xtask check-starters

      - name: Copy each project's solution/ over its src/
        run: cargo xtask apply-solutions --ci

      - name: Solutions are formatted
        run: cargo fmt --all --check

      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
